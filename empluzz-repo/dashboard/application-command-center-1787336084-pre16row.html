<title>Application Command Center</title>
<!-- Without this a phone lays the page out at a 980px virtual viewport and then
     scales it down, which is the real reason the body scrolled sideways: the

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;
--bg:#0e1015;--card:#161922;--card2:#1b1f2a;--ink:#e7e9f0;--muted:#949cb0;--line:#272c39;
--must:#ff6f61;--strong:#4ade80;--stretch:#fbbf24;--watch:#949cb0;--dead:#6b7385;
--accent:#7aa2ff;--urgent:rgba(255,111,97,.13);--soon:rgba(251,191,36,.10);
--okbg:rgba(74,222,128,.14);--nybg:rgba(122,162,255,.14);--clbg:rgba(148,156,176,.13);
--unbg:rgba(251,191,36,.15);--blbg:rgba(255,111,97,.15);}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px}
.htop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
.stamp{color:var(--muted);font-size:12px}
.runs{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--ink);
padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0e1015;font-weight:600}
button.primary:hover{opacity:.88;color:#0e1015}
#runmsg{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);
overflow-x:auto}
nav button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;
padding:9px 12px;color:var(--muted);white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav .count{font-size:11px;color:var(--muted);margin-left:4px}
main{padding:16px 20px 40px}
.bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px}
.pill b{font-size:15px}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;
min-width:210px;background:var(--card2);color:var(--ink)}
input[type=search]::placeholder{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);
border:1px solid var(--line);border-radius:9px;overflow:hidden}
th{background:var(--card2);text-align:left;font-size:11px;text-transform:uppercase;
letter-spacing:.04em;color:var(--muted);padding:8px 9px;white-space:nowrap;cursor:pointer;
border-bottom:1px solid var(--line)}
th:hover{color:var(--accent)}
th.noSort{cursor:default}th.noSort:hover{color:var(--muted)}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:#1a1e28}
tr.urgent td{background:var(--urgent)}
tr.soon td{background:var(--soon)}
.cv{font-weight:700;font-size:11px;letter-spacing:.03em;white-space:nowrap}
.cv.MUSTAPPLY{color:var(--must)}.cv.STRONG{color:var(--strong)}
.cv.STRETCH{color:var(--stretch)}.cv.WATCH{color:var(--watch)}
.cv.CLOSED,.cv.BLOCKED{color:var(--dead)}
.st{display:inline-block;font-weight:700;font-size:10.5px;letter-spacing:.04em;
padding:2px 7px;border-radius:5px;white-space:nowrap}
.st.OPEN{background:var(--okbg);color:var(--strong)}
.st.NOTYET{background:var(--nybg);color:var(--accent)}
.st.CLOSED{background:var(--clbg);color:var(--dead)}
.st.UNCONFIRMED{background:var(--unbg);color:var(--stretch)}
.st.BLOCKED{background:var(--blbg);color:var(--must)}
.sthint{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:12px;max-width:430px}
.note .txt{white-space:pre-wrap}
.note.tog{position:relative;padding-right:24px;cursor:pointer}
.note.tog:hover{color:var(--ink)}
.note.tog:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.note.clip .txt{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{position:absolute;top:8px;right:7px;color:var(--accent);font-size:11px;line-height:1;
transition:transform .12s ease}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
.note.open .chev{transform:rotate(90deg)}
.notetog{font-size:11px;color:var(--accent);cursor:pointer;user-select:none;
display:inline-block;border:0;background:none;padding:0;font-weight:400;letter-spacing:0;
text-transform:none}
.notetog:hover{text-decoration:underline;color:var(--accent)}
.notetog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act{display:inline-block;font-weight:700;font-size:10.5px;letter-spacing:.04em;
padding:2px 7px;border-radius:5px;white-space:nowrap}
.act.SUBMIT{background:var(--okbg);color:var(--strong)}
.act.VERIFY{background:var(--unbg);color:var(--stretch)}
.act.WRITENOW{background:var(--blbg);color:var(--must)}
.act.WRITE{background:var(--nybg);color:var(--accent)}
.act.LATER,.act.WAIT{background:var(--clbg);color:var(--dead)}
.act.BLOCKED{background:var(--blbg);color:var(--must)}
.act.DEAD{background:transparent;color:var(--dead);padding-left:0}
.act.APPLIED{background:var(--okbg);color:var(--strong)}
.actsub{display:block;color:var(--dead);font-size:10.5px;margin-top:3px}
.pk{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.pk.Ready{color:var(--stretch)}
.pk.Done{color:var(--strong)}
.pk.Blocked{color:var(--must)}
button.mini{padding:3px 8px;font-size:11px;border-radius:6px;white-space:nowrap}
button.mini:disabled{opacity:.5;cursor:default;border-color:var(--line);color:var(--muted)}
.dl{white-space:nowrap;font-variant-numeric:tabular-nums}
.days{font-weight:700;font-variant-numeric:tabular-nums}
.days.red{color:var(--must)}.days.amber{color:var(--stretch)}

.wg{font-weight:700;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;
padding:2px 7px;border-radius:6px;display:inline-block}
.wg.up{color:var(--strong);background:var(--okbg)}
.wg.even{color:var(--stretch);background:var(--unbg)}
.wg.down{color:var(--must);background:var(--blbg)}
.wg.none{color:var(--dead);background:transparent;font-weight:500;padding-left:0}
.wgest{display:block;color:var(--dead);font-size:10.5px;letter-spacing:.04em;margin-top:2px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--strong)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);
border:1px solid var(--line);border-radius:9px}
.kv{display:grid;grid-template-columns:210px 1fr;gap:0;background:var(--card);
border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv>div{padding:7px 10px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){background:var(--card2);font-weight:600;color:var(--muted);font-size:12.5px}
.sec{grid-column:1/-1!important;background:#212736!important;font-weight:700!important;
font-size:11px!important;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)!important}
.hint{color:var(--muted);font-size:12px;margin:10px 0 0}
.stale{color:var(--stretch)}
h3{font-size:13px;margin:6px 0;color:var(--muted);font-weight:600}

/* ---- table scroller -------------------------------------------------
   The page body must never scroll sideways. Every table now sits in its
   own horizontal scroller, so a wide table scrolls inside its own box
   and the page around it stays where he put it. Measured before this
   change: 1140px of content in a 390px viewport. */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;
background:var(--card);border:1px solid var(--line);border-radius:9px}
.tw table{border:0;border-radius:0;min-width:840px}
.sync{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;
background:var(--clbg);color:var(--dead)}
.sync.ok{background:var(--okbg);color:var(--strong)}
.sync.warn{background:var(--unbg);color:var(--stretch)}

/* ---- phone: stacked cards -------------------------------------------
   Under 700px a twelve column table is unreadable however you scroll it,
   so each row becomes a card and the column headers become inline labels
   on each field. Same markup, same dark palette, no second render path. */
@media(max-width:700px){
  header{padding:12px 14px}
  nav{padding:0 14px}
  main{padding:14px 14px 40px}
  h1{font-size:16px}
  .runs button{flex:1 1 auto}
  input[type=search]{min-width:0;width:100%}
  .tw{overflow-x:visible;background:none;border:0;border-radius:0}
  .tw table{display:block;min-width:0;width:100%;background:none;border:0}
  .tw thead{display:none}
  .tw tbody{display:block}
  .tw tr{display:block;background:var(--card);border:1px solid var(--line);
    border-radius:10px;margin:0 0 10px;padding:4px 0}
  .tw tr.urgent{border-color:var(--must)}
  .tw tr.soon{border-color:var(--stretch)}
  .tw tr:hover td,.tw tr.urgent td,.tw tr.soon td{background:transparent}
  /* The label sits in a left gutter rather than as a flex sibling. A cell with
     more than one child (role plus location, packet status plus its button)
     then still stacks the way it does on desktop instead of being laid out
     side by side, which is what a flex row did to it. */
  .tw td{display:block;position:relative;width:auto;border-bottom:0;
    padding:6px 12px 6px 104px;min-height:26px}
  .tw td::before{content:attr(data-label);position:absolute;left:12px;top:9px;
    width:84px;color:var(--muted);font-size:10.5px;line-height:1.4;
    text-transform:uppercase;letter-spacing:.04em}
  .tw td.note{max-width:none}
  .tw td.note.tog{padding-right:30px}
  .tw td.note .chev{top:9px;right:10px}
  .note{max-width:none}
  .kv{grid-template-columns:1fr}
  .kv>div:nth-child(odd){border-bottom:0;padding:8px 10px 0}
  .kv>div:nth-child(even){padding-top:2px}
}
</style>

</head>

function lsWrite(){try{localStorage.setItem(LS,JSON.stringify({v:3,applied,dirty}))}catch(e){}}

/* Carry the old kind|company|role ticks onto slugs, once. Rows whose title a
   sweep has since reworded will not match and are simply left behind, which is
   the same data loss as before; from here on the slug makes it impossible. */
function migrateOld(){
  const old=lsRead(LS_OLD);
  if(!old||typeof old!=="object")return null;
  const map={};
  [["int",INT],["sch",SCH]].forEach(function(p){
    p[1].forEach(function(r){map[p[0]+"|"+r[1]+"|"+r[2]]=slugOf(p[0],r)});});
  const out={};let hit=0;
  Object.keys(old).forEach(function(k){const sl=map[k];if(sl){out[sl]=old[k];hit++}});
  return hit?out:null;
}

/* Key order must not affect equality, so compare canonical forms. */
function canon(o){const t={};Object.keys(o||{}).sort().forEach(k=>{t[k]=o[k]});return JSON.stringify(t)}

/* First paint is synchronous. Three sources, in priority order: ticks this
   device made and has not managed to publish, then the state published into
   the document, then whatever this device remembers, then the seed. */
function initLocal(){
  const local=lsRead(LS), pub=PUB&&PUB.applied;
  if(local&&local.applied){
    applied=local.applied;dirty=!!local.dirty;
    if(pub&&canon(applied)===canon(pub))dirty=false;   /* our ticks already landed */
    else if(pub&&!dirty)applied=pub;                   /* nothing pending, take the published truth */
    lsWrite();return;
  }
  applied=pub||migrateOld()||Object.assign({},SEED);
  dirty=false;lsWrite();
}

/* No network call any more. The published state arrived inside the document,
   so there is nothing to fetch and nothing to 404 on. All this does is resolve
   the capability and decide whether this device owes the artifact a push. */
async function initRemote(){
  try{ART=(window.claude&&window.claude.use)?await window.claude.use("artifact"):null}
  catch(e){ART=null}
  saveState=ART?(dirty?"local":"synced"):"local";
  stamp();
  if(ART&&dirty)scheduleSave();
}
function scheduleSave(){
  if(!ART)return;
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,3500);   /* one reload for a run of ticks */
}

/* Rebuild this page's complete source with the current state baked in. The
   shell serves a transformed copy of what we published, so cut our own content
   back out by its markers and re-wrap it. See the route note above. */
async function buildDoc(){
  const res=await fetch("index.html",{cache:"no-store"});
  if(!res.ok)throw{code:"transform_error",message:"could not read own source, HTTP "+res.status};
  const src=await res.text();
  const h0=src.indexOf(H_A),h1=src.indexOf(H_B),b0=src.indexOf(B_A),b1=src.indexOf(B_B);
  if(h0<0||h1<=h0||b0<0||b1<=b0)throw{code:"transform_error",message:"document markers missing"};
  const head=src.slice(h0,h1+H_B.length);
  let body=src.slice(b0,b1+B_B.length);
  const a0=body.indexOf(S_A),a1=body.indexOf(S_B);
  if(a0<0||a1<=a0)throw{code:"transform_error",message:"state markers missing"};
  const payload={v:4,updated:ASOF,count:Object.keys(applied).length,applied:applied};
  body=body.slice(0,a0)+S_A+"const PUB="+JSON.stringify(payload)+";"+S_B+body.slice(a1+S_B.length);
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
       +head+'\n</head>\n<body>\n'+body+'\n</body>\n</html>';
}

async function flushSave(){
  if(!ART||saveState==="saving")return;
  saveState="saving";stamp();
  let doc;
  try{doc=await buildDoc()}
  catch(err){
    /* Cannot reproduce our own source. Never publish a guess. */
    saveState="error";stamp();
    console.warn("Command center: source rebuild failed,",err&&err.message);
    return;
  }
  const snap=canon(applied);
  /* The publish reloads this view on success, so park the reading position. */
  try{sessionStorage.setItem(UI,JSON.stringify(
      {tab:tab,q:q,sort:sort,y:window.scrollY,note:Array.from(NOPEN),all:NALL}))}catch(e){}
  try{
    await ART.publish(doc);
    if(canon(applied)===snap){dirty=false;saveState="synced";lsWrite();}
    else{dirty=true;saveState="local";lsWrite();scheduleSave();}
    /* The shell reloads us about now. Nothing below is guaranteed to run. */
  }catch(err){
    try{sessionStorage.removeItem(UI)}catch(e){}
    const c=(err&&err.code)||"upstream_error";
    if(c==="conflict"){
      /* Routine. Another view published first and the shell is already
         reloading every view to the winner, so there is nothing to do. */
      saveState="synced";
    }else if(c==="rate_limited"){
      saveState="local";setTimeout(flushSave,15000);
    }else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||
             c==="consent_required"||c==="capability_disabled"||
             c==="capability_removed"||c==="read_only_path"){
      /* Permanent for this view. Stop trying and say so; ticks keep working
         locally. This is the branch the files form hit on every load. */
      ART=null;saveState="readonly";
    }else if(c==="too_large"||c==="invalid_content"||c==="transform_error"){
      ART=null;saveState="error";
      console.warn("Command center: publish rejected,",c,err&&err.message);
    }else{
      saveState="error";setTimeout(flushSave,8000);
    }
  }
  stamp();
}

/* Put the reader back where the reload took them from. */
function restoreUI(){
  let u=null;
  try{const v=sessionStorage.getItem(UI);if(v)u=JSON.parse(v);sessionStorage.removeItem(UI)}catch(e){}
  if(!u)return null;
  if(u.tab)tab=u.tab;
  if(typeof u.q==="string")q=u.q;
  if(u.sort&&u.sort.k)sort=u.sort;
  if(Array.isArray(u.note))NOPEN=new Set(u.note);
  NALL=!!u.all;
  return u;
}

/* Guard against a sweep introducing a duplicate or blank slug, which would
   silently make two rows share one tick. */
(function(){const seen={},bad=[];
  [["int",INT],["sch",SCH]].forEach(function(p){p[1].forEach(function(r){
    const sl=slugOf(p[0],r);
    if(!sl)bad.push("missing slug on "+r[1]);
    else if(seen[sl])bad.push("duplicate slug "+sl);
    else seen[sl]=1;});});
  if(bad.length)console.warn("Command center: row slug problem, applied state will collide:",bad);
})();
/* Notes are collapsed to one line by default. NOPEN holds the rows the reader has
   opened; NALL is the expand-everything switch. Neither is persisted, a fresh load
   should always come back tidy. */
let NOPEN=new Set(),NALL=false;

const today=()=>new Date(ASOF+"T12:00:00");
function daysLeft(d){if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
  return Math.round((new Date(d+"T12:00:00")-today())/864e5);}
/* An unresolved fact the posting has not answered. Both markers are written by the
   sweeps, so this reads real text and never guesses from location. */
function unresolved(note){return /\[UNVERIFIED\]|STILL CONFIRM/i.test(note||"");}
function score(cv,d,st,pk,wlo,whi,on,opens){
  const dl=daysLeft(d);let v=CONV[cv]||0;
  if(dl!==null&&dl>=0)v+=dl<=7?60:dl<=14?45:dl<=30?25:dl<=60?10:0;
  if(!on&&(pk==="Ready"||pk==="Done"))v+=30;
  if(wlo!==null&&wlo>=BASE_WAGE)v+=6;
  if(whi!==null&&whi<BASE_WAGE)v-=6;
  if(st==="NOTYET"){
    /* A closed cycle cannot be acted on, so it sinks below everything open. Inside the
       waiting group the deadline is months away and tells you nothing, so rank by how
       soon the cycle OPENS instead. Without this every waiting row scored the same. */
    v-=200;
    const op=daysLeft(opens);
    if(op!==null&&op>=0)v+=op<=45?30:op<=90?20:op<=150?10:0;
  }
  if(st==="UNCONFIRMED")v-=40;
  if(st==="BLOCKED")v-=400;
  if(st==="CLOSED")v-=800;
  return v;
}
/* What to physically do with this row next. Order matters, first match wins. */
function act(x){
  if(x.on)return{k:"APPLIED",l:"APPLIED",w:"Marked applied "+(applied[x.key]||"")};
  if(x.st==="CLOSED")return{k:"DEAD",l:"CLOSED",w:"Deadline passed or the posting is gone"};
  if(x.st==="BLOCKED")return{k:"BLOCKED",l:"BLOCKED",w:"Something outside the application is in the way"};
  if(x.st==="NOTYET")return{k:"WAIT",l:"WAIT",w:"Cycle has not opened yet"};
  if(unresolved(x.r[9]))return{k:"VERIFY",l:"VERIFY",w:"Carries an unconfirmed fact. Resolve it before spending a letter on this."};
  if(x.pk==="Ready"||x.pk==="Done")return{k:"SUBMIT",l:"SUBMIT",w:"Packet already exists. This one just needs sending."};
  if(x.days!==null&&x.days>=0&&x.days<=14)return{k:"WRITENOW",l:"WRITE NOW",w:"Deadline inside two weeks and nothing written yet"};
  if(x.cv==="MUST APPLY"||x.cv==="STRONG")return{k:"WRITE",l:"WRITE",w:"High conviction, no deadline pressure yet"};
  return{k:"LATER",l:"LATER",w:"Worth doing, nothing forcing it this week"};
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORD={OPEN:0,UNCONFIRMED:1,NOTYET:2,BLOCKED:3,CLOSED:4};
const LBL={OPEN:"OPEN",NOTYET:"NOT OPEN",CLOSED:"CLOSED",UNCONFIRMED:"UNCONFIRMED",BLOCKED:"BLOCKED"};

function rows(kind){
  const src=kind==="int"?INT:SCH;
  return src.map((r,i)=>{
    const key=slugOf(kind,r);
    const dl=r[5],days=daysLeft(dl);
    let st=r[10];
    if(days!==null&&days<0)st="CLOSED";
    /* Wage is an internship-only field. Guarding on kind matters now that the
       slug occupies index 12 on a scholarship row, where wage used to be
       undefined; without this a slug containing a digit would render as pay. */
    const wp=kind==="int"?wageParse(r[12]):null;
    const x={r,i,kind,key,cv:r[0],dl,days,on:!!applied[key],st,hint:r[11],pk:r[8]||"Not started",
             wage:kind==="int"?(r[12]||""):"",wlo:wp?wp.lo:null,whi:wp?wp.hi:null,
             /* Filter text stops before the slug, otherwise typing "int" or
                "sch" matched every row on the tab. */
             hay:r.slice(0,SLUG_AT[kind]).join(" ").toLowerCase()};
    x.pri=score(x.cv,dl,st,x.pk,x.wlo,x.whi,x.on,kind==="sch"?r[4]:"");
    x.act=act(x);
    return x;
  });
}
function filt(list,inArchive){
  const f=list.filter(x=>x.on===inArchive);
  if(!q)return f;const s=q.toLowerCase();
  return f.filter(x=>x.hay.includes(s));
}
function sortRows(a){
  const k=sort.k,d=sort.d;
  return a.slice().sort((x,y)=>{
    let A,B;
    if(k==="pri"){A=x.pri;B=y.pri}
    else if(k==="days"){A=x.days===null?9999:x.days;B=y.days===null?9999:y.days}
    else if(k==="st"){A=ORD[x.st];B=ORD[y.st]}
    else if(k==="wg"){A=x.wlo===null?-1:x.wlo;B=y.wlo===null?-1:y.wlo}
    else{A=String(x.r[k]).toLowerCase();B=String(y.r[k]).toLowerCase()}
    return A<B?-1*d:A>B?1*d:0;});
}
/* Instant in the UI. The save is debounced and never blocks the checkbox.
   Ticking again during an in-flight publish is safe: flushSave compares the
   state it sent against the state now and reschedules if they differ. */
function toggle(k){
  applied[k]?delete applied[k]:applied[k]=ASOF;
  dirty=true;lsWrite();render();
  if(ART){if(saveState!=="saving")saveState="local";scheduleSave()}
  stamp();
}
function setSort(k){sort.k===k?sort.d*=-1:(sort={k,d:(k==="pri")?-1:1});render();}

function wageParse(w){
  if(!w)return null;
  const head=String(w).split("/hr")[0];
  const nums=(head.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(!nums.length)return null;
  return {lo:Math.min.apply(null,nums),hi:Math.max.apply(null,nums)};
}
function wageCell(w){
  const p=wageParse(w);
  if(!p)return '<span class="wg none">not listed</span>';
  const c=p.lo>=BASE_WAGE?"up":(p.hi>=BASE_WAGE?"even":"down");
  const t=c==="up"?"Floor is at or above your $26 Kelvin rate"
    :c==="even"?"Range straddles your $26 Kelvin rate"
    :"Tops out below your $26 Kelvin rate";
  const est=/est\./i.test(w);
  return '<span class="wg '+c+'" title="'+esc(t)+'">'+esc(String(w).replace(/ est\.( floor)?$/i,""))+'</span>'+
    (est?'<span class="wgest">est.</span>':'');
}
/* One line by default. The whole cell is the toggle so opening a note costs no
   extra row height, which was the entire point of the exercise. */
function noteCell(key,txt,lab){
  lab=' data-label="'+(lab||"Notes")+'"';
  if(!txt)return '<td class="note"'+lab+'><span class="sub">none</span></td>';
  const long=String(txt).length>90;
  if(!long)return '<td class="note"'+lab+'><span class="txt">'+esc(txt)+'</span></td>';
  const open=NALL||NOPEN.has(key);
  return '<td class="note tog'+(open?" open":" clip")+'"'+lab+' role="button" tabindex="0"'+
    ' aria-expanded="'+open+'" title="'+(open?"Collapse this note":"Open this note")+'"'+
    ' onclick="noteTog(\''+key+'\')"'+
    ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();noteTog(\''+key+'\')}">'+
    '<span class="txt">'+esc(txt)+'</span><span class="chev">&#9656;</span></td>';
}
function noteTog(key){NOPEN.has(key)?NOPEN.delete(key):NOPEN.add(key);render();}
function notesAll(){NALL=!NALL;NOPEN.clear();render();}

function actCell(x){
  const a=x.act;
  return '<span class="act '+a.k+'" title="'+esc(a.w)+'">'+a.l+'</span>'+
    (!x.on&&x.pri>0?'<span class="actsub">'+x.pri+'</span>':'');
}
function packetCell(x){
  const done=x.pk==="Done",dead=x.st==="CLOSED"||x.st==="BLOCKED";
  return '<td data-label="Packet"><span class="pk '+esc(x.pk).replace(/[^A-Za-z]/g,"")+'">'+esc(x.pk)+'</span>'+
    '<button class="mini" onclick="cvBtn(\''+x.kind+'\','+x.i+',this)"'+(dead?' disabled':'')+
    ' title="'+(done?'Rewrite the cover letter for this role':'Build the cover letter for this role and file it in Packets')+'">'+
    (done?'Rebuild':'Build letter')+'</button></td>';
}
function dayCell(d){
  if(d===null)return '<span class="sub">none</span>';
  const c=d<0?"":d<=7?"red":d<=21?"amber":"";
  return '<span class="days '+c+'">'+(d<0?"passed":d+"d")+'</span>';
}
function stCell(x){
  return '<span class="st '+x.st+'">'+LBL[x.st]+'</span>'+
    (x.hint?'<span class="sthint">'+esc(x.hint)+'</span>':'');
}
function rowCls(x){if(x.st!=="OPEN")return"";if(x.days===null||x.days<0)return"";
  return x.days<=7?"urgent":x.days<=21?"soon":"";}
function th(label,k){const on=sort.k===k;return '<th onclick="setSort(\''+k+'\')">'+label+(on?(sort.d>0?" ▲":" ▼"):"")+'</th>';}

  return '<div class="tw"><table><thead><tr>'+

  '<th class="noSort">Role / Location</th>'+th("Wage","wg")+th("Deadline","dl")+th("Left","days")+

  list.map(x=>{const r=x.r;return '<tr class="'+rowCls(x)+'">'+

}

function simple(head,data,tag){
  return '<div class="tw"><table><thead><tr>'+head.map((h,i)=>'<th class="noSort">'+h+
    (i===head.length-1?' '+notesBtn():'')+'</th>').join("")+
  '</tr></thead><tbody>'+data.map((r,ri)=>'<tr>'+r.map((c,i)=>
    i===r.length-1?noteCell(tag+"|"+ri,c,head[i])
    :'<td'+(i===1?' class="nm"':'')+' data-label="'+esc(head[i]||"")+'">'+esc(c)+'</td>').join("")+
  '</tr>').join("")+'</tbody></table></div>';
}

function render(){
  const iAll=rows("int"),sAll=rows("sch");
  const iOpen=filt(iAll,false),sOpen=filt(sAll,false);
  const appliedCt=iAll.filter(x=>x.on).length+sAll.filter(x=>x.on).length;
  /* The stat pills describe the tab you are looking at. They used to mix both
     lists, so the Internships tab reported "Open now 3" while showing two rows,
     the third being an open scholarship. */
  const cur=tab==="sch"?sOpen:iOpen;
  const liveNow=cur.filter(x=>x.st==="OPEN").length;

  document.getElementById("nav").innerHTML=[
    ["int","Internships",iOpen.length],["sch","Scholarships",sOpen.length],

  ].map(([k,l,c])=>'<button class="'+(tab===k?"on":"")+'" onclick="go(\''+k+'\')">'+l+

  let h="";

    h+='<div class="bar">'+
      '<span class="pill">Open now <b>'+liveNow+'</b></span>'+
      '<span class="pill">MUST APPLY <b>'+must+'</b></span>'+
      (tab==="int"?'<span class="pill">Pays &ge; $26/hr <b>'+paysUp+'</b></span>':'')+
      '<span class="pill">Closing in 7 days <b>'+urgent+'</b></span>'+

      '<input type="search" placeholder="Filter..." value="'+esc(q)+'" oninput="q=this.value;render()">'+
      '</div>';
    h+= tab==="int"?tblInt(sortRows(iOpen),false):tblSch(sortRows(sOpen),false);
    h+='<p class="hint"><b>Do next</b> is the column to work top to bottom. '
     +'<span class="act SUBMIT">SUBMIT</span> a letter already exists, just send it. '
     +'<span class="act VERIFY">VERIFY</span> the row carries an unconfirmed fact, usually housing, resolve it first. '
     +'<span class="act WRITENOW">WRITE NOW</span> deadline inside two weeks and nothing written. '
     +'<span class="act WRITE">WRITE</span> high conviction, no clock yet. '
     +'<span class="act LATER">LATER</span> real but not urgent. '
     +'<span class="act WAIT">WAIT</span> cycle has not opened. '
     +'The grey number is the raw score, shown on actionable rows so the ordering is checkable. '
     +'Hover any chip for the reason.</p>'
     +'<p class="hint"><b>Build letter</b> copies a ready packet prompt for that row. Paste it into a fresh chat '
     +'and the cover letter gets written and filed in Packets. Nothing is ever submitted for you. '
     +'Wage chips compare against your $26.00/hr Kelvin Thermal rate: '
     +'<span class="wg up">green</span> the floor already beats it, '
     +'<span class="wg even">amber</span> the range straddles it, '
     +'<span class="wg down">red</span> it tops out below. '
     +'Rows marked <b>est.</b> are Indeed annualized estimates, not a rate the employer posted. '
     +'Notes sit on one line; click a note to open it, or hit <b>expand all</b> in the header. '
     +'Tick <b>Applied</b> to move a row into the archive.</p>';
  }
  else if(tab==="app"){
    const ia=sortRows(filt(iAll,true)),sa=sortRows(filt(sAll,true));
    h+='<div class="bar"><span class="pill">Applied <b>'+appliedCt+'</b></span>'+
       '<input type="search" placeholder="Filter..." value="'+esc(q)+'" oninput="q=this.value;render()"></div>';
    h+='<h3>Internships</h3>'+tblInt(ia,true);
    h+='<h3 style="margin-top:18px">Scholarships</h3>'+tblSch(sa,true);
    h+='<p class="hint">Untick to send a row back to the active list. Use <b>Export Applied</b> to save this record outside the browser.</p>';
  }
  else if(tab==="cal"){
    h+=simple(["Type","Name","Tier","Typical Window","Check Starting","Status","Last Checked","Notes"],CAL,"cal");
    h+='<p class="hint">Not yet open. A sweep promotes a row to the active list when its cycle opens.</p>';
  }
  else if(tab==="out"){
    h+=simple(["Type","Name","Role / Award","Screened","Reason"],OUT,"out");
    h+='<p class="hint">Sweeps read this first and will not resurface anything here.</p>';
  }
  else if(tab==="pro"){
    h+='<div class="kv">'+PROF.map(p=>p[0]==="sec"
      ?'<div class="sec">'+esc(p[1])+'</div>'
      :'<div>'+esc(p[0])+'</div><div>'+esc(p[1])+'</div>').join("")+'</div>';
    h+='<p class="hint">Single source of truth. If a fact is wrong here it is wrong in every application.</p>';
  }
  document.getElementById("main").innerHTML=h;
}
function go(k){tab=k;q="";render();}

/* ---- clipboard ---------------------------------------------------------
   This page cannot reach Drive or start a chat on its own, so every action
   button hands you a ready prompt instead. Paste it into a new chat and the
   packet builder does the writing and the filing. Nothing is ever submitted. */
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).catch(()=>legacyCopy(t));
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  const ta=document.createElement("textarea");ta.value=t;
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy")}catch(e){}
  ta.remove();
}
function flash(btn,label,msg){
  const m=document.getElementById("runmsg"),old=btn.textContent;
  btn.textContent=label;btn.disabled=true;m.textContent=msg;
  setTimeout(()=>{btn.textContent=old;btn.disabled=false},1800);
}
function cvPrompt(kind,i){
  const r=(kind==="int"?INT:SCH)[i];
  if(kind==="int")return [
    "Build an application packet for "+r[1]+", "+r[2]+".",
    "Posting: "+r[7],
    "Source: "+r[6]+". Location: "+r[3]+". Term: "+r[4]+".",
    "Deadline: "+(r[5]||"rolling, no posted date"),
    "Tracker notes: "+r[9],
    "",
    "Write the cover letter in my voice, then save it to the Packets folder in Drive. Do not submit anything."
  ].join("\n");
  return [
    "Build an application packet for the "+r[1]+" scholarship, sponsored by "+r[2]+".",
    "Link: "+r[7],
    "Award: "+r[3]+". Opens: "+r[4]+". Deadline: "+(r[5]||"not posted yet")+".",
    "Eligibility gate: "+r[6],
    "Tracker notes: "+r[9],
    "",
    "Write the essay or letter in my voice, then save it to the Packets folder in Drive. Do not submit anything."
  ].join("\n");
}
function cvBtn(kind,i,btn){
  const r=(kind==="int"?INT:SCH)[i];
  copyText(cvPrompt(kind,i)).then(()=>
    flash(btn,"Copied",'Packet prompt for '+r[1]+' copied. Paste it into a new chat and the letter gets written and filed in Packets.'));
}

async function runTask(taskId,btn){
  const m=document.getElementById("runmsg");
  const old=btn.textContent;
  if(window.cowork&&window.cowork.runScheduledTask){
    btn.disabled=true;btn.textContent="Starting...";m.textContent="";
    try{
      await window.cowork.runScheduledTask(taskId);
      m.textContent="Sweep started. Results arrive in chat.";
    }catch(e){
      m.textContent="Could not start: "+(e&&e.message?e.message:e);
    }
    btn.disabled=false;btn.textContent=old;
    return;
  }
  copyText("Fire the scheduled task "+taskId+" now, then update the command center with the results.")
    .then(()=>flash(btn,"Copied","Sweep command copied. Paste it into a chat to run it from here."));
}
/* Two save paths. On claude.ai the viewer frame blocks a plain download link, so the
   file goes through the downloads capability and the reader confirms it. Everywhere
   else (desktop artifact, a local copy of this file) the blob link still works. */
async function exportApplied(){
  const m=document.getElementById("runmsg");
  const lines=["type,name,detail,marked_applied"];
  rows("int").filter(x=>x.on).forEach(x=>lines.push(['internship',x.r[1],x.r[2],applied[x.key]].map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(",")));
  rows("sch").filter(x=>x.on).forEach(x=>lines.push(['scholarship',x.r[1],x.r[2],applied[x.key]].map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(",")));
  const csv=lines.join("\n"),name="applied-archive-"+ASOF+".csv",n=lines.length-1;
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:csv});m.textContent="Saved "+n+" rows to "+name+".";}
    catch(e){m.textContent=(e&&e.code==="declined")?"Save cancelled.":"Could not save: "+((e&&e.message)||e);}
    return;
  }
  const b=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  m.textContent="Exported "+n+" rows.";
}
/* Header stamps: the swept date and where applied state is currently living. */
function stamp(){
  const sd=document.getElementById("swept");
  if(sd){
    sd.textContent=SWEPT||"never";
    sd.title=SWEPT?"Newest Last Checked date on the Calendar tab. Derived from the data, not hand written."
                  :"No Last Checked date in the calendar data yet.";
    const age=SWEPT?Math.round((new Date(ASOF+"T12:00:00")-new Date(SWEPT+"T12:00:00"))/864e5):9999;
    sd.className=age>10?"stale":"";
  }
  const sy=document.getElementById("sync");
  if(!sy)return;
  const M={local:["ticks not yet saved","warn"],
           saving:["saving ticks, the page will refresh",""],
           synced:["ticks saved to this artifact","ok"],
           readonly:["read only here, ticks stay on this device","warn"],
           error:["save failed, ticks kept on this device","warn"]};
  const m=M[saveState]||M.local;
  sy.textContent=m[0];sy.className="sync "+m[1];
}

document.getElementById("asof").textContent=ASOF;
initLocal();
const _ui=restoreUI();
render();
stamp();
if(_ui&&typeof _ui.y==="number")window.scrollTo(0,_ui.y);
initRemote();
</script>
